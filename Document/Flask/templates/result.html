<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results - Dish_Dash</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #1E293B; }
    .card { background: white; border: 1px solid #F1F5F9; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .custom-table th { background: #F8FAFC; text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; padding: 16px; color: #64748B; font-weight: 700; border-bottom: 1px solid #E2E8F0; }
    .custom-table td { padding: 16px; border-bottom: 1px solid #F1F5F9; font-size: 13px; }
    .custom-table tr:hover td { background-color: #FDFDFF; color: #6366F1; }
</style>
</head>
<body class="min-h-screen">
<nav class="px-12 py-8 border-b border-slate-100 flex justify-between items-center bg-white">
    <a href="/" class="text-lg font-bold uppercase tracking-tight text-[#0F172A]">Dish_Dash</a>
    <a href="/web" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-indigo-600 transition-colors">Back to Engine</a>
</nav>

<main class="px-12 py-12 max-w-7xl mx-auto w-full">
    <div class="mb-12">
        <h2 class="text-4xl font-bold mb-2 text-[#0F172A]">Analysis Overview</h2>
        <p class="text-slate-400 font-medium">Insights generated for: <span class="text-indigo-600 italic">"{{ search_term }}"</span></p>
    </div>

    <div class="card p-8 mb-12 overflow-hidden">
        <h3 class="text-xs font-bold uppercase tracking-[0.2em] mb-6 text-slate-400">Top Recommendations</h3>
        <div class="overflow-x-auto">
            {{ keyword | safe }}
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
        <div class="card p-8">
            <h3 class="text-sm font-bold mb-6 text-slate-700">Rating Variance</h3>
            <canvas id="ratingsChart"></canvas>
        </div>
        <div class="card p-8">
            <h3 class="text-sm font-bold mb-6 text-slate-700">Cost Projection</h3>
            <canvas id="costChart"></canvas>
        </div>
    </div>
</main>

<script>
const names = {{ names | safe }};
const ratings = {{ ratings | safe }};
const cost = {{ cost | safe }};

const commonOptions = {
    plugins: { legend: { display: false } },
    scales: {
        y: { grid: { display: false }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
    }
};

new Chart(document.getElementById('ratingsChart'), {
    type: 'bar',
    data: {
        labels: names,
        datasets: [{
            data: ratings,
            backgroundColor: '#6366F1',
            borderRadius: 12
        }]
    },
    options: commonOptions
});

new Chart(document.getElementById('costChart'), {
    type: 'line',
    data: {
        labels: names,
        datasets: [{
            data: cost,
            borderColor: '#6366F1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: '#0F172A'
        }]
    },
    options: commonOptions
});
</script>
</body>
</html>
