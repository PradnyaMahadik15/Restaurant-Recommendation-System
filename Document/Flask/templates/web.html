<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicting - Dish_Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1E293B; }
        .input-minimal { 
            border-bottom: 1px solid #E2E8F0; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .input-minimal:focus { 
            outline: none; 
            border-color: #6366F1; 
        }
        #loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #loader.active { display: flex; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
        .btn-search {
            background: #0F172A;
            transition: all 0.3s ease;
        }
        .btn-search:hover {
            background: #6366F1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="loader">
        <div class="text-center">
            <div class="w-10 h-10 border-2 border-slate-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-[11px] font-bold uppercase tracking-[0.3em] text-indigo-600">Processing Data</p>
        </div>
    </div>

    <nav class="px-12 py-10 flex justify-between items-center max-w-7xl mx-auto w-full">
        <a href="/" class="text-xl font-bold tracking-tight uppercase text-[#0F172A]">Dish_Dash</a>
        <div class="flex gap-10">
            <a href="/" class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 hover:text-indigo-600">Home</a>
            <a href="/web" class="text-[10px] font-bold uppercase tracking-[0.2em] border-b-2 border-indigo-600 text-[#0F172A] pb-1">Predicting</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6">
        <div class="w-full max-w-2xl text-center">
            <h1 class="text-5xl font-bold mb-6 tracking-tight text-[#0F172A]">Input Reference.</h1>
            <p class="text-slate-500 mb-16 font-normal text-lg">Enter a restaurant to map your preference network.</p>

            <form action="/result" method="POST" autocomplete="off" id="search-form" class="relative">
                <input type="text" name="output" id="output" placeholder="Search restaurant name..." 
                       class="w-full py-10 text-4xl font-light text-center bg-transparent input-minimal mb-12 text-indigo-600 placeholder:text-slate-200">
                
                <div id="suggestions" class="hidden absolute w-full z-50 glass rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] border border-slate-100 mt-[-30px]"></div>
                
                <button type="submit" class="btn-search w-full py-6 text-white text-[11px] font-bold uppercase tracking-[0.4em] shadow-xl shadow-indigo-900/10">
                    Generate Analysis
                </button>
            </form>
        </div>
    </main>

    <script>
        const inputField = document.getElementById('output');
        const suggestionsBox = document.getElementById('suggestions');
        const form = document.getElementById('search-form');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', () => { loader.classList.add('active'); });

        inputField.addEventListener('input', async function() {
            const val = this.value;
            if (!val) return suggestionsBox.classList.add('hidden');
            const res = await fetch(`/autocomplete?term=${val}`);
            const data = await res.json();
            suggestionsBox.innerHTML = "";
            suggestionsBox.classList.remove('hidden');
            data.forEach(item => {
                let div = document.createElement("div");
                div.innerHTML = item;
                div.className = "px-8 py-5 cursor-pointer hover:bg-slate-50 text-sm font-medium border-b border-slate-50 last:border-0 hover:text-indigo-600 transition-colors text-left";
                div.onclick = () => { inputField.value = item; suggestionsBox.innerHTML = ""; };
                suggestionsBox.appendChild(div);
            });
        });
    </script>
</body>
</html>
