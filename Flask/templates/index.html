<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dish_Dash | Culinary Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .serif { font-family: 'Fraunces', serif; }
        .hero-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.05) 0, transparent 50%);
        }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .float { animation: float 6s ease-in-out infinite; }
        .nav-link { position: relative; transition: color 0.3s ease; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #6366F1; transition: width 0.3s; }
        .nav-link:hover::after { width: 100%; }
        .btn-gradient { background: linear-gradient(135deg, #1E293B 0%, #334155 100%); transition: all 0.3s transform; }
    </style>
</head>
<body class="min-h-screen flex flex-col hero-mesh">
    <nav class="px-12 py-10 flex justify-between items-center max-w-7xl mx-auto w-full relative z-20">
        <span class="text-xl font-bold tracking-tight uppercase text-[#0F172A]">Dish <span class="text-indigo-500">_</span>Dash</span>
        <div class="flex items-center gap-10">
            <a href="/" class="nav-link text-[11px] font-bold uppercase tracking-[0.2em] text-[#0F172A]">Home</a>
            <a href="/web" class="nav-link text-[11px] font-bold text-slate-400 uppercase tracking-[0.2em] hover:text-indigo-600">Search Engine</a>
        </div>
    </nav>

    <main class="flex-grow flex flex-col lg:flex-row items-center justify-between px-12 max-w-7xl mx-auto w-full gap-20 py-12 relative z-10">
        <div class="lg:w-1/2">
            <div class="inline-block px-4 py-1.5 mb-8 border border-indigo-100 bg-indigo-50/50 rounded-full text-[11px] font-semibold uppercase tracking-widest text-indigo-600">Next-Gen Recommendation Engine</div>
            <h1 class="text-7xl md:text-8xl font-bold leading-[1.1] mb-10 serif text-[#0F172A]">Predicting <br><span class="text-indigo-600 italic">Excellence.</span></h1>
            <p class="text-slate-600 text-lg md:text-xl leading-relaxed mb-12 max-w-md font-normal">An advanced algorithmic approach to flavor profiling and dining discovery.</p>
            <a href="/web" class="btn-gradient inline-flex items-center justify-center px-12 py-6 text-white text-[11px] font-bold uppercase tracking-[0.25em] hover:scale-105 transition-all shadow-2xl shadow-indigo-900/10">Access the Engine</a>
        </div>
        
        <div class="lg:w-1/2 relative">
            <div class="relative w-full aspect-[4/5] overflow-hidden rounded-3xl shadow-[0_32px_64px_-15px_rgba(0,0,0,0.2)] float bg-slate-200">
                <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&q=80&w=1200" 
                     class="w-full h-full object-cover" 
                     alt="Modern Table Setting"
                     loading="lazy">
            </div>
            
            <div class="absolute -bottom-12 -left-12 w-56 h-56 border-[16px] border-white shadow-2xl hidden md:block bg-slate-100 overflow-hidden rounded-2xl z-20">
                <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&q=80&w=600" 
                     class="w-full h-full object-cover" 
                     alt="Artisanal Detail"
                     loading="lazy">
            </div>
        </div>
    </main>
</body>
</html>
